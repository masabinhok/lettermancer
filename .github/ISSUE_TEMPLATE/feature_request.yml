name: Idea or feature
description: Suggest a mechanic, content, or improvement.
labels: [idea]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would it improve?
      description: The problem or the moment in play this is about.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: How it would work. For content (an enemy, boon, relic), give its numbers too.
    validations:
      required: true
  - type: checkboxes
    id: help
    attributes:
      label: Contributing
      options:
        - label: I'd like to build this myself
